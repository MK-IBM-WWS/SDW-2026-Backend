<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .hasDraft }}Публикация тарифа{{ else }}Добавление тарифа{{ end }}</title>
    <link rel="stylesheet" href="/static/styles/style.css?v=3">
    <script src="/static/scripts/media-fallback.js?v=1"></script>
</head>
<body>
    <div class="phone phone--pattern">
        <header class="page-header page-header--draft">
            <h1 class="page-header__title">Тариф</h1>
            <span class="draft-status">{{ if .hasDraft }}{{ .tariff.TariffStatus }}{{ else }}новый{{ end }}</span>
        </header>

        <main class="draft">
            {{ if .hasDraft }}
            <form class="api-publish" data-id="{{ .tariff.TariffID }}">

                <div class="draft__media-stack">
                    <section class="media-field">
                        <span class="draft__label">Фото</span>
                        <div class="media-field__preview">
                            <img data-media-fallback="/static/media/example.jpg" src="{{ .preview.ImageURL }}" alt="Фото черновика {{ .tariff.TariffName }}">
                        </div>
                    </section>

                    <section class="media-field">
                        <span class="draft__label">Видео</span>
                        <div class="media-field__preview">
                            <video data-media-fallback="/static/media/example.mp4" src="{{ .preview.VideoURL }}" poster="{{ .preview.ImageURL }}" muted playsinline controls preload="metadata"></video>
                        </div>
                    </section>
                </div>

                <label class="draft__label" for="name">Название</label>
                <input class="draft__input" id="name" name="tariff_name" type="text" maxlength="100" required value="{{ .tariff.TariffName }}">

                <label class="draft__label" for="description">Краткое описание</label>
                <textarea class="draft__input draft__input--area" id="description" name="short_description" maxlength="500" rows="3" required>{{ .tariff.ShortDescription }}</textarea>

                <div class="draft__two-columns">
                    <div>
                        <label class="draft__label" for="price">Цена, ₽ / месяц</label>
                        <input class="draft__input" id="price" name="price_per_month" type="number" min="0" required value="{{ .tariff.PricePerMonth }}">
                    </div>
                    <div>
                        <label class="draft__label" for="ram">RAM, GB</label>
                        <input class="draft__input" id="ram" name="ram_gb" type="number" min="1" required value="{{ .tariff.RAMGB }}">
                    </div>
                </div>

                <button class="draft__submit" type="submit">Опубликовать</button>
            </form>
            {{ else }}
            <form class="api-create" enctype="multipart/form-data">
                <div class="draft__media-stack">
                    <section class="media-field">
                        <label class="draft__label" for="image_file">Фото</label>
                        <label class="media-field__preview media-field__preview--upload" for="image_file" aria-label="Выбрать фото">
                            <img id="image_preview" alt="Выбранное фото" hidden>
                            <span id="image_prompt" aria-hidden="true">+</span>
                        </label>
                        <input class="visually-hidden draft__file" id="image_file" name="image" type="file" accept="image/*" required>
                    </section>
                    <section class="media-field">
                        <label class="draft__label" for="video_file">Видео</label>
                        <label class="media-field__preview media-field__preview--upload" for="video_file" aria-label="Выбрать видео">
                            <video id="video_preview" muted playsinline controls preload="metadata" hidden></video>
                            <span id="video_prompt" aria-hidden="true">+</span>
                        </label>
                        <input class="visually-hidden draft__file" id="video_file" name="video" type="file" accept="video/*" required>
                    </section>
                </div>

                <label class="draft__label" for="name">Название</label>
                <input class="draft__input" id="name" name="tariff_name" type="text" maxlength="100" required placeholder="Например, Selectel Start">

                <button class="draft__submit" type="submit">Далее</button>
            </form>
            {{ end }}
        </main>

        {{ template "tabbar.html" . }}
    </div>
    {{ if not .hasDraft }}<script src="/static/scripts/draft-preview.js?v=3" defer></script>{{ end }}
<script src="/static/scripts/api-forms.js" defer></script>
</body>
</html>
