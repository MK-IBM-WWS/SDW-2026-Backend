{{ define "tabbar.html" }}
<nav class="tabbar" aria-label="Основная навигация">
    <a class="tabbar__item {{ if eq .activeTab "feed" }}tabbar__item--active{{ end }}" href="/tariffs/feed">
        <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 11.2 12 3l9 8.2v9.3a.5.5 0 0 1-.5.5H15v-6H9v6H3.5a.5.5 0 0 1-.5-.5z"/>
        </svg>
        <span>Лента</span>
    </a>
    <a class="tabbar__item {{ if eq .activeTab "draft" }}tabbar__item--active{{ end }}" href="/tariffs/draft">
        <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 2h9l4 4v16H6zm8 1.5V7h3.5M9 12h7M9 16h5"/>
        </svg>
        <span>Добавление</span>
    </a>
    <a class="tabbar__item {{ if eq .activeTab "tiles" }}tabbar__item--active{{ end }}" href="/tariffs">
        <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 0h7v7h-7z"/>
        </svg>
        <span>Плитка</span>

</nav>
{{ end }}
