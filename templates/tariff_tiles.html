<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тарифы облачного хостинга</title>
    <link rel="stylesheet" href="/static/styles/style.css?v=3">
    <script src="/static/scripts/media-fallback.js?v=1"></script>
</head>
<body>
    <div class="phone phone--pattern">
        <header class="page-header">
            <h1 class="page-header__title">Тарифы</h1>
        </header>

        <form class="filter" action="/tariffs" method="GET">
            <div class="filter__range-wrap">
                <label class="filter__label" for="priceStep">Максимальная цена: <strong id="priceCaption"></strong></label>
                <input class="filter__range" id="priceStep" type="range" min="0" max="3" step="1" value="{{ if eq .priceLimit "1000" }}1{{ else if eq .priceLimit "10000" }}2{{ else if eq .priceLimit "500000" }}3{{ else }}0{{ end }}">
                <input id="priceLimit" name="priceLimit" type="hidden" value="{{ .priceLimit }}">
            </div>
        </form>

        <main class="tiles">
            {{ range .tariffs }}
            <article class="tile">
                <a class="tile__link" href="/tariffs/feed?id={{ .TariffID }}">
                <img data-media-fallback="/static/media/example.jpg" class="tile__image" src="{{ .ImageURL }}" alt="{{ .TariffName }}">
                <div class="tile__body">
                    <h2 class="tile__name">{{ .TariffName }}</h2>
                    <p class="tile__price">{{ .PricePerMonth }} ₽ / месяц</p>
                    <span class="tile__likes" aria-label="Количество лайков">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21S4 16.4 4 10.8A4.6 4.6 0 0 1 12 7.7a4.6 4.6 0 0 1 8 3.1C20 16.4 12 21 12 21Z"/></svg>
                        {{ .LikeCount }}
                    </span>
                    <span class="tile__open" aria-hidden="true">›</span>
                </div>
                </a>
                {{ if .IsOwner }}<form class="tile__delete-form api-delete" data-id="{{ .TariffID }}">

                    <button class="tile__delete" type="submit" aria-label="Удалить тариф {{ .TariffName }}" title="Логически удалить тариф">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 7h16M9 7V4h6v3m-8 0 1 14h8l1-14M10 11v6m4-6v6"/>
                        </svg>
                    </button>
                </form>{{ end }}
            </article>
            {{ else }}
            <p class="empty-state">По выбранной цене тарифы не найдены.</p>
            {{ end }}
        </main>

        {{ template "tabbar.html" . }}
    </div>
    <script src="/static/scripts/price-filter.js?v=3" defer></script>
<script src="/static/scripts/api-forms.js" defer></script>
</body>
</html>
