basePath: /api
definitions:
  auth.Role:
    enum:
    - creator
    - moderator
    type: string
    x-enum-varnames:
    - Creator
    - Moderator
  ds.TariffStatus:
    enum:
    - черновик
    - опубликован
    - удален
    type: string
    x-enum-varnames:
    - StatusDraft
    - StatusPublished
    - StatusDeleted
  ds.User:
    properties:
      is_moderator:
        description: Этим флагом управляет сервер или администратор БД; регистрация
          всегда ставит false.
        type: boolean
      login:
        type: string
      user_id:
        type: integer
    type: object
  feed.Meta:
    properties:
      batch_id:
        type: string
      batch_size:
        type: integer
      batch_start:
        type: integer
      position:
        type: integer
      redis_key:
        type: string
      session_id:
        type: string
    type: object
  handler.CreatorResponse:
    properties:
      login:
        type: string
      user_id:
        type: integer
    type: object
  handler.Credentials:
    properties:
      login:
        example: student
        type: string
      password:
        example: student123
        type: string
    type: object
  handler.DeleteData:
    properties:
      deleted:
        type: boolean
    type: object
  handler.DeleteEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.DeleteData'
      status:
        example: success
        type: string
    type: object
  handler.ErrorEnvelope:
    properties:
      message:
        type: string
      status:
        example: fail
        type: string
    type: object
  handler.FeedEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.TariffResponse'
      feed:
        $ref: '#/definitions/feed.Meta'
      status:
        type: string
    type: object
  handler.LikeData:
    properties:
      is_liked:
        type: integer
      like_count:
        type: integer
      tariff_id:
        type: integer
    type: object
  handler.LikeEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.LikeData'
      status:
        example: success
        type: string
    type: object
  handler.ListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.ListTariffResponse'
        type: array
      index_enabled:
        type: boolean
      limit:
        type: integer
      page:
        type: integer
      query_ms:
        type: number
      status:
        example: success
        type: string
      total:
        type: integer
    type: object
  handler.ListTariffResponse:
    properties:
      created_at:
        type: string
      formed_at:
        type: string
      image_name:
        type: string
      image_url:
        type: string
      is_liked:
        type: integer
      is_owner:
        type: integer
      like_count:
        type: integer
      price_per_month:
        type: integer
      ram_gb:
        type: integer
      short_description:
        type: string
      tariff_id:
        type: integer
      tariff_name:
        type: string
      tariff_status:
        $ref: '#/definitions/ds.TariffStatus'
      user_id:
        type: integer
      video_name:
        type: string
      video_url:
        type: string
    type: object
  handler.LogoutData:
    properties:
      logged_out:
        type: boolean
    type: object
  handler.LogoutEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.LogoutData'
      status:
        example: success
        type: string
    type: object
  handler.TariffEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.TariffResponse'
      status:
        example: success
        type: string
    type: object
  handler.TariffResponse:
    properties:
      created_at:
        type: string
      creator:
        $ref: '#/definitions/handler.CreatorResponse'
      creator_id:
        description: ID автора, который сервер автоматически назначает из проверенного
          JWT при создании.
        type: integer
      formed_at:
        type: string
      image_name:
        description: |-
          Несмотря на старое Go-имя ImageURL, здесь хранится имя объекта MinIO.
          В JSON оно называется image_name; действительная ссылка формируется отдельно в TariffResponse.
        type: string
      image_url:
        type: string
      is_liked:
        type: integer
      is_owner:
        description: gorm:"-" означает, что поле не хранится в таблице. 1 — читатель
          является автором; 0 — нет.
        type: integer
      like_count:
        type: integer
      price_per_month:
        type: integer
      ram_gb:
        type: integer
      short_description:
        type: string
      tariff_id:
        type: integer
      tariff_name:
        type: string
      tariff_status:
        $ref: '#/definitions/ds.TariffStatus'
      video_name:
        type: string
      video_url:
        type: string
    type: object
  handler.TokenEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.TokenResponse'
      status:
        example: success
        type: string
    type: object
  handler.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        example: 3600
        type: integer
      role:
        allOf:
        - $ref: '#/definitions/auth.Role'
        example: creator
      token_type:
        example: Bearer
        type: string
      user_id:
        example: 1
        type: integer
    type: object
  handler.UserEnvelope:
    properties:
      data:
        $ref: '#/definitions/ds.User'
      status:
        example: success
        type: string
    type: object
  handler.likeRequest:
    properties:
      value:
        example: 1
        type: integer
    type: object
info:
  contact: {}
  description: Каталог облачных тарифов. Публичное чтение, JWT для методов создателя.
    Регистрация и вход доступны без JWT.
  title: Cloud Tariffs API
  version: "4.0"
paths:
  /tariffs:
    get:
      description: Сортировка price_per_month, tariff_id; query_ms — время COUNT и
        SELECT, без HTTP/MinIO. Максимум 100 карточек за запрос.
      parameters:
      - description: Bearer JWT
        in: header
        name: Authorization
        type: string
      - description: Максимальная цена
        in: query
        minimum: 0
        name: priceLimit
        type: integer
      - default: 1
        description: Страница
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Размер страницы
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ListEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      summary: Страница опубликованных тарифов с фильтром цены
      tags:
      - Тарифы
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Название, 1–100 символов
        in: formData
        name: tariff_name
        required: true
        type: string
      - description: Фото JPEG/PNG/GIF/WebP, до 10 MiB
        in: formData
        name: image
        type: file
      - description: Видео MP4/WebM, до 50 MiB
        in: formData
        name: video
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.TariffEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "401":
          description: Нет JWT, токен истёк или отозван
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "403":
          description: Чужой тариф или недопустимая роль
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "503":
          description: Redis недоступен
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Создать черновик с фото и видео
      tags:
      - Тарифы
  /tariffs/{id}:
    delete:
      parameters:
      - description: Положительный ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.DeleteEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "401":
          description: Нет JWT, токен истёк или отозван
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "403":
          description: Чужой тариф или недопустимая роль
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "503":
          description: Redis недоступен
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Логически удалить свой тариф
      tags:
      - Тарифы
  /tariffs/{id}/likes:
    post:
      consumes:
      - application/json
      parameters:
      - description: Положительный ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 1 — поставить, 0 — отменить
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.likeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LikeEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "401":
          description: Нет JWT, токен истёк или отозван
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "403":
          description: Чужой тариф или недопустимая роль
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "503":
          description: Redis недоступен
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Поставить или отменить свой лайк
      tags:
      - Тарифы
  /tariffs/{id}/publication:
    put:
      consumes:
      - multipart/form-data
      parameters:
      - description: Положительный ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Название, 1–100 символов
        in: formData
        name: tariff_name
        required: true
        type: string
      - description: Описание, 1–500 символов
        in: formData
        name: short_description
        required: true
        type: string
      - description: Цена >= 0
        in: formData
        name: price_per_month
        required: true
        type: integer
      - description: RAM > 0
        in: formData
        name: ram_gb
        required: true
        type: integer
      - description: Новое фото, до 10 МБ; без файла сохраняется прежнее
        in: formData
        name: image
        type: file
      - description: Новое видео, до 50 МБ; без файла сохраняется прежнее
        in: formData
        name: video
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TariffEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "401":
          description: Нет JWT, токен истёк или отозван
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "403":
          description: Чужой тариф или недопустимая роль
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "503":
          description: Redis недоступен
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Опубликовать свой черновик
      tags:
      - Тарифы
  /tariffs/draft:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TariffEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "401":
          description: Нет JWT, токен истёк или отозван
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "403":
          description: Чужой тариф или недопустимая роль
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "503":
          description: Redis недоступен
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Единственный черновик текущего пользователя
      tags:
      - Тарифы
  /tariffs/feed:
    get:
      description: При первом обращении создаёт 100 уникальных карточек. Сессия feed_session
        — HttpOnly cookie без авторизации, TTL Redis 24 часа. position — сквозной
        номер. init не продвигает ленту.
      parameters:
      - description: Bearer JWT
        in: header
        name: Authorization
        type: string
      - description: Порядковый номер в текущем наборе или сразу после него
        in: query
        minimum: 1
        name: position
        type: integer
      - description: Сформировать/восстановить ленту при старте приложения
        in: query
        name: init
        type: boolean
      - description: Открыть карточку из плитки
        in: query
        minimum: 1
        name: id
        type: integer
      - description: Следующая в Redis-порядке после id
        in: query
        name: next
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.FeedEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      summary: Карточка случайной ленты из Redis
      tags:
      - Тарифы
  /users:
    post:
      consumes:
      - application/json
      parameters:
      - description: Логин 3–50 [a-z0-9_.-], пароль 8–72 байта
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.Credentials'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.UserEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      summary: Зарегистрировать пользователя
      tags:
      - Пользователи
  /users/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Логин и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.Credentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "401":
          description: Неверный логин или пароль
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      summary: Войти и получить JWT
      tags:
      - Пользователи
  /users/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LogoutEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "401":
          description: Нет JWT, токен истёк или отозван
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "403":
          description: Чужой тариф или недопустимая роль
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "503":
          description: Redis недоступен
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Выйти и отозвать текущий JWT
      tags:
      - Пользователи
securityDefinitions:
  BearerAuth:
    description: Введите Bearer и пробел, затем access_token из data ответа POST /users/login.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
